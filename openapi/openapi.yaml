openapi: 3.1.0
info:
  title: Subspace control plane
  version: 0.1.0
  description: |
    HTTP control plane for WorkflowRuns. Live timeline events use WebSocket at
    GET /api/runs/{repo}/{runId}/events (see TimelineEvent); not a generated HTTP call.
servers:
  - url: http://localhost:4201
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
  /api/repos:
    get:
      operationId: listRepos
      responses:
        "200":
          description: Registered Repos from Subspace home repos.json
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repo"
        "500":
          $ref: "#/components/responses/TextError"
  /api/workflows/{repo}:
    get:
      operationId: listWorkflows
      parameters:
        - $ref: "#/components/parameters/RepoName"
      responses:
        "200":
          description: Workflows for the Repo under Subspace home
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
  /api/workflows/{repo}/{workflowId}:
    get:
      operationId: getWorkflow
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow with derived Connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          $ref: "#/components/responses/TextError"
    patch:
      operationId: patchWorkflowVisualization
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchWorkflowVisualization"
      responses:
        "200":
          description: Workflow after visualization patch (YAML updated and committed in Repo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
  /api/runs/{repo}:
    get:
      operationId: listRuns
      parameters:
        - $ref: "#/components/parameters/RepoName"
      responses:
        "200":
          description: WorkflowRuns for the Repo (newest id first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowRun"
        "404":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
    post:
      operationId: startRun
      parameters:
        - $ref: "#/components/parameters/RepoName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
      responses:
        "200":
          description: Started WorkflowRun (execution root from Repo registry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
  /api/runs/{repo}/{runId}:
    get:
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: WorkflowRun
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "404":
          $ref: "#/components/responses/TextError"
  /api/runs/{repo}/{runId}/pause:
    post:
      operationId: pauseRun
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Updated WorkflowRun
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
  /api/runs/{repo}/{runId}/resume:
    post:
      operationId: resumeRun
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Updated WorkflowRun
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
  /api/runs/{repo}/{runId}/stop:
    post:
      operationId: stopRun
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Updated WorkflowRun
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
  /api/runs/{repo}/{runId}/rewind:
    post:
      operationId: rewindRun
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewindRequest"
      responses:
        "200":
          description: Updated WorkflowRun
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
  /api/runs/{repo}/{runId}/events:
    get:
      operationId: followRunEvents
      description: |
        WebSocket upgrade. Server sends JSON TimelineEvent messages until the
        run ends. Use a WebSocket client; not covered by the generated HTTP client.
      parameters:
        - $ref: "#/components/parameters/RepoName"
        - $ref: "#/components/parameters/RunId"
      responses:
        "101":
          description: Switching Protocols (WebSocket)
        "404":
          $ref: "#/components/responses/TextError"

components:
  parameters:
    RepoName:
      name: repo
      in: path
      required: true
      schema:
        type: string
      description: Registered Repo name
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
      description: WorkflowRun id
  responses:
    TextError:
      description: Plain-text error
      content:
        text/plain:
          schema:
            type: string
  schemas:
    Repo:
      type: object
      required: [name, absolutePath]
      properties:
        name:
          type: string
        absolutePath:
          type: string
          description: Absolute path of the Repo working tree
    StartRequest:
      type: object
      required: [workflowId]
      properties:
        workflowId:
          type: string
        projectPath:
          type: string
          description: Optional override; nested start uses Repo registry path when omitted
        inputOverrides:
          type: object
          additionalProperties:
            type: string
          description: "stepId.inputName → value"
        argumentOverrides:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: processId → args
    RewindRequest:
      type: object
      required: [stepId]
      properties:
        stepId:
          type: string
    WorkflowRun:
      type: object
      required: [id, workflowId, projectPath, status]
      properties:
        id:
          type: string
        workflowId:
          type: string
        projectPath:
          type: string
        status:
          type: string
        cursorStepId:
          type: string
        stepRuns:
          type: array
          items:
            $ref: "#/components/schemas/StepRun"
        processRuns:
          type: array
          items:
            $ref: "#/components/schemas/ProcessRun"
    StepRun:
      type: object
      required: [stepId, status]
      properties:
        stepId:
          type: string
        status:
          type: string
        iteration:
          type: integer
          description: Loop iteration when relevant (0 omitted)
    ProcessRun:
      type: object
      required: [processId, status]
      properties:
        processId:
          type: string
        stepId:
          type: string
        status:
          type: string
        exitCode:
          type: integer
    Workflow:
      type: object
      required: [id, name, steps, connections]
      properties:
        id:
          type: string
        name:
          type: string
        defaultProject:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepView"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
    StepView:
      type: object
      required: [id, name, mode]
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          type: string
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/InputView"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/OutputView"
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessView"
        visualization:
          $ref: "#/components/schemas/Visualization"
    ProcessView:
      type: object
      required: [id, name, command]
      properties:
        id:
          type: string
        name:
          type: string
        command:
          type: string
        arguments:
          type: array
          items:
            type: string
        workingDirectory:
          type: string
        when:
          oneOf:
            - $ref: "#/components/schemas/Predicate"
            - type: "null"
    Predicate:
      type: object
      properties:
        eq:
          type: object
          required: [input, value]
          properties:
            input:
              type: string
            value:
              type: string
        in:
          type: object
          required: [input, values]
          properties:
            input:
              type: string
            values:
              type: array
              items:
                type: string
        exists:
          type: object
          required: [input]
          properties:
            input:
              type: string
    ProcessPatch:
      type: object
      required: [stepId, id, name, command]
      properties:
        stepId:
          type: string
        id:
          type: string
        name:
          type: string
        command:
          type: string
        arguments:
          type: array
          items:
            type: string
        workingDirectory:
          type: string
        when:
          oneOf:
            - $ref: "#/components/schemas/Predicate"
            - type: "null"
    Visualization:
      type: object
      properties:
        position:
          $ref: "#/components/schemas/VizPosition"
        size:
          $ref: "#/components/schemas/VizSize"
    VizPosition:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number
    VizSize:
      type: object
      required: [width, height]
      properties:
        width:
          type: number
        height:
          type: number
    PatchWorkflowVisualization:
      type: object
      description: Send steps, processes, or both.
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepVizPatch"
        processes:
          type: array
          items:
            $ref: "#/components/schemas/ProcessPatch"
    StepVizPatch:
      type: object
      required: [id, visualization]
      properties:
        id:
          type: string
        visualization:
          $ref: "#/components/schemas/Visualization"
    InputView:
      type: object
      required: [name]
      properties:
        name:
          type: string
        source:
          $ref: "#/components/schemas/SourceView"
    OutputView:
      type: object
      required: [name]
      properties:
        name:
          type: string
        value:
          type: string
    SourceView:
      type: object
      required: [stepId, output]
      properties:
        stepId:
          type: string
        output:
          type: string
    Connection:
      type: object
      required: [sourceStepId, sourceOutput, targetStepId, targetInput]
      properties:
        sourceStepId:
          type: string
        sourceOutput:
          type: string
        targetStepId:
          type: string
        targetInput:
          type: string
    TimelineEvent:
      type: object
      required: [type]
      description: JSONL / WebSocket timeline event
      properties:
        type:
          type: string
        ts:
          type: string
        runId:
          type: string
        workflowId:
          type: string
        processId:
          type: string
        stepId:
          type: string
        data:
          type: string
        stream:
          type: string
      additionalProperties: true
