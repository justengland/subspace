id: decision
name: Decision
defaultProject: ""
steps:
    - id: set-kind
      name: Set Kind
      mode: series
      maxIterations: null
      when: null
      inputs: []
      outputs:
        - name: kind
          value: csv
      processes:
        - id: noop
          name: Noop
          command: "true"
          arguments: []
          workingDirectory: ""
          when: null
      visualization:
        position:
            x: 156.41445922851562
            "y": 37.368194580078125
        size:
            width: 168
            height: 46
    - id: decide
      name: Decision
      mode: decision
      maxIterations: null
      when: null
      inputs:
        - name: kind
          value: ""
          source:
            stepId: set-kind
            output: kind
      outputs: []
      processes:
        - id: handle-csv
          name: Handle CSV
          command: sh
          arguments:
            - -c
            - echo csv
          workingDirectory: ""
          when:
            eq:
                input: kind
                value: csv
            in: null
            exists: null
        - id: handle-json
          name: Handle JSON
          command: sh
          arguments:
            - -c
            - echo json
          workingDirectory: ""
          when:
            eq: null
            in:
                input: kind
                values:
                    - json
                    - ndjson
            exists: null
        - id: handle-tagged
          name: Handle Tagged
          command: sh
          arguments:
            - -c
            - echo tagged
          workingDirectory: ""
          when:
            eq: null
            in: null
            exists:
                input: tag
      visualization:
        position:
            x: 90.88746643066406
            "y": 138
        size:
            width: 300
            height: 46
