id: decision
name: Decision Branch
steps:
  - id: set-kind
    name: Set Kind
    mode: series
    outputs:
      - name: kind
        value: csv
    processes:
      - id: noop
        name: Noop
        command: true
  - id: branch
    name: Branch
    mode: decision
    inputs:
      - name: kind
        source:
          stepId: set-kind
          output: kind
    processes:
      - id: handle-csv
        name: Handle CSV
        when:
          eq:
            input: kind
            value: csv
        command: sh
        arguments: ["-c", "echo csv-branch"]
      - id: handle-json
        name: Handle JSON
        when:
          in:
            input: kind
            values: [json, ndjson]
        command: sh
        arguments: ["-c", "echo json-branch"]
      - id: handle-tagged
        name: Handle Tagged
        when:
          exists:
            input: tag
        command: sh
        arguments: ["-c", "echo tagged-branch"]
